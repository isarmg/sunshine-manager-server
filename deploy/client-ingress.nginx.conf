# Include in the trusted HTTPS server{} alongside the existing admin location.
# Supply a verified full certificate chain and private key in that server block.
# Set the upstream to the Manager's configured address on its own host.
# Use 127.0.0.1:18104 for same-host ingress, or its private IP for remote ingress.
# Keep the HTTP backend reachable only through the controlled ingress network.
location /xscc/v1/ {
    proxy_pass http://127.0.0.1:18104;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    client_max_body_size 16k;
    # Do not log Authorization, request bodies, tickets or cookies.
    access_log off;
}
